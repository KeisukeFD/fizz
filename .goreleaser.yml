version: 2
project_name: fizz

# fizz is a library: no binaries, only the changelog and the GitHub release.
builds:
  - skip: true

release:
  github:
    owner: wI2L
    name: fizz
  draft: true
  prerelease: auto

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - '^test(\([[:word:]]+\))??:'
      - '^ci(\([[:word:]]+\))??:'
      - '^chore(\([[:word:]]+\))??:'
      - 'Merge pull request'
