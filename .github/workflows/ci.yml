name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    name: Tests (go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        go:
          - "1.27.x"
          - "stable"
        include:
          - os: macos-latest
            go: "stable"
          - os: windows-latest
            go: "stable"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Run tests
        shell: bash
        run: ./ci/test.sh
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.txt

  tip:
    name: Tests (go tip)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install Go tip
        run: |
          go install golang.org/dl/gotip@latest
          gotip download
          echo "$(gotip env GOROOT)/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: ./ci/test.sh
